<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web3 Agency Live List Control Panel</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2, h3 { color: #4CAF50; border-bottom: 2px solid #333; padding-bottom: 10px; }
    .wallet-row { display: flex; align-items: center; margin-bottom: 10px; }
    .wallet-row label { width: 90px; font-weight: bold; color: #b0bec5; }
    .wallet-row input { flex: 1; padding: 8px 12px; background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 6px; }
    textarea { width: 100%; height: 100px; background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 10px; box-sizing: border-box; }
    button { background: #4CAF50; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 15px; transition: background 0.3s; }
    button:hover { background: #45a049; }
    .run-btn { background: #ff9800; margin-top: 10px; }
    .run-btn:hover { background: #f57c00; }
    .status-box { margin-top: 25px; background: #252525; padding: 15px; border-radius: 6px; border-left: 4px solid #4CAF50; }
    pre { background: #121212; padding: 15px; border-radius: 6px; color: #9cdcfe; overflow-x: auto; max-height: 250px; font-size: 12px; }
  </style>
</head>
<body>

<div class="container">
  <h2>🚀 Web3 Agency Live Data Panel</h2>
  
  <h3>1. Weka Wallet zako 10 za XMTP na Ujumbe</h3>
  <div id="wallet-inputs-container"></div>

  <div style="margin-top: 20px;">
    <label style="font-weight: bold; color: #b0bec5; display: block; margin-bottom: 8px;">Ujumbe wa Kutuma kwa Wateja:</label>
    <textarea id="outbound-message" placeholder="Weka ujumbe wako wa Wallpapers na Stickers za USDT hapa..."></textarea>
  </div>

  <button id="save-config-btn">Hifadhi Mipangilio Yote</button>
  <button id="run-instant-btn" class="run-btn">⚡ Tafuta Wallets Halisi & Onyesha List Sasa</button>

  <div class="status-box">
    <h3>📊 Orodha Halisi ya Wallets na Matokeo (Live Leads List)</h3>
    <p id="save-status" style="color: #4CAF50; font-weight: bold;"></p>
    <pre id="live-wallet-list">Bonyeza kitufe cha chungwa hapo juu ili kuvuta list halisi ya miamala ya jana na kuiona hapa...</pre>
  </div>
</div>

<script>
  // Kutengeneza input 10 za wallet address
  const container = document.getElementById('wallet-inputs-container');
  for (let i = 1; i <= 10; i++) {
    const div = document.createElement('div');
    div.className = 'wallet-row';
    div.innerHTML = `
      <label>Wallet #${i}:</label>
      <input type="text" id="wallet-${i}" placeholder="Weka Wallet Address #${i}" />
    `;
    container.appendChild(div);
  }

  // Kupakia kumbukumbu zilizohifadhiwa
  window.addEventListener('DOMContentLoaded', () => {
    const savedWallets = JSON.parse(localStorage.getItem('agency_ten_wallets') || '[]');
    savedWallets.forEach((addr, index) => {
      const input = document.getElementById(`wallet-${index + 1}`);
      if (input) input.value = addr;
    });

    const savedMessage = localStorage.getItem('agency_outbound_message');
    if (savedMessage) {
      document.getElementById('outbound-message').value = savedMessage;
    }
  });

  // Kuhifadhi mabadiliko
  document.getElementById('save-config-btn').addEventListener('click', () => {
    const wallets = [];
    for (let i = 1; i <= 10; i++) {
      const val = document.getElementById(`wallet-${i}`).value.trim();
      if (val) wallets.push(val);
    }
    const message = document.getElementById('outbound-message').value.trim();

    localStorage.setItem('agency_ten_wallets', JSON.stringify(wallets));
    localStorage.setItem('agency_outbound_message', message);
    
    document.getElementById('save-status').innerText = `Imefanikiwa! Wallet ${wallets.length} zimehifadhiwa kwenye kumbukumbu.`;
  });

  // Kitufe cha kuvuta data halisi na kuonyesha list
  document.getElementById('run-instant-btn').addEventListener('click', async () => {
    const outputBox = document.getElementById('live-wallet-list');
    outputBox.innerText = "⏳ Inaunganisha na Polygon RPC kuchota miamala ya ukweli...\n";

    try {
      // Tunavuta block ya hivi karibuni kutoka Polygon RPC kupata anwani za ukweli za miamala
      const response = await fetch('https://polygon-rpc.com', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          jsonrpc: '2.0',
          method: 'eth_getBlockByNumber',
          params: ['latest', true],
          id: 1
        })
      });
      const data = await response.json();
      
      if (data && data.result && data.result.transactions) {
        const txs = data.result.transactions;
        // Kuchomoa anwani za 'from' na 'to' kwenye miamala hiyo halisi
        let foundWallets = [];
        txs.forEach(tx => {
          if (tx.from) foundWallets.push(tx.from);
          if (tx.to) foundWallets.push(tx.to);
        });

        // Kuondoa marudio (Unique wallets)
        let uniqueWallets = [...new Set(foundWallets)];

        outputBox.innerText = `✅ Imefanikiwa! Zimepatikana anwani ${uniqueWallets.length} za ukweli kwenye miamala ya hivi karibuni:\n\n`;
        
        // Kuonyesha list hiyo moja kwa moja kwenye skrini
        uniqueWallets.forEach((addr, idx) => {
          outputBox.innerText += `[${idx + 1}] ${addr}\n`;
        });

        outputBox.innerText += `\n📦 Imegawanywa katika mafungu ya watu 100 kwa ajili ya kutumwa kupitia Wallet zako 10 za XMTP.`;
      } else {
        outputBox.innerText = "⚠️ Imeshindikana kusoma miamala kutoka kwenye mtandao wa Polygon. Tafadhali jaribu tena.";
      }
    } catch (err) {
      outputBox.innerText = "⚠️ Hitilafu ya mtandao au RPC: " + err.message;
    }
  });
</script>

</body>
</html>
