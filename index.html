<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web3 Agency Unified Control Panel</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2, h3 { color: #4CAF50; border-bottom: 2px solid #333; padding-bottom: 10px; }
    .wallet-row { display: flex; align-items: center; margin-bottom: 10px; }
    .wallet-row label { width: 90px; font-weight: bold; color: #b0bec5; }
    .wallet-row input { flex: 1; padding: 8px 12px; background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 6px; }
    button { background: #4CAF50; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 15px; }
    button:hover { background: #45a049; }
    .status-box { margin-top: 25px; background: #252525; padding: 15px; border-radius: 6px; border-left: 4px solid #4CAF50; }
  </style>
</head>
<body>

<div class="container">
  <h2>🚀 Web3 Agency Control Panel</h2>
  <p>Dhibiti Wallet 10 za kutuma ujumbe wa Duka lako la Wallpapers na Stickers za USDT.</p>

  <h3>⚙️ Kikosi Kazi cha Wallet 10</h3>
  <div id="wallet-inputs-container"></div>

  <button id="save-config-btn">Hifadhi Mipangilio</button>

  <div class="status-box">
    <h3>📊 Hali ya Mfumo</h3>
    <p><strong>Lengo:</strong> Wallets 50,000 kwa siku</p>
    <p id="save-status" style="color: #4CAF50; font-weight: bold;"></p>
  </div>
</div>

<script>
  const container = document.getElementById('wallet-inputs-container');
  for (let i = 1; i <= 10; i++) {
    const div = document.createElement('div');
    div.className = 'wallet-row';
    div.innerHTML = `
      <label>Wallet #${i}:</label>
      <input type="text" id="wallet-${i}" placeholder="Weka Polygon Wallet Address #${i}" />
    `;
    container.appendChild(div);
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedWallets = JSON.parse(localStorage.getItem('agency_ten_wallets') || '[]');
    savedWallets.forEach((addr, index) => {
      const input = document.getElementById(`wallet-${index + 1}`);
      if (input) input.value = addr;
    });
  });

  document.getElementById('save-config-btn').addEventListener('click', () => {
    const wallets = [];
    for (let i = 1; i <= 10; i++) {
      const val = document.getElementById(`wallet-${i}`).value.trim();
      if (val) wallets.push(val);
    }
    localStorage.setItem('agency_ten_wallets', JSON.stringify(wallets));
    document.getElementById('save-status').innerText = `Imefanikiwa! Wallet ${wallets.length} zimehifadhiwa.`;
  });
</script>

</body>
</html>
